# yaml-language-server: $schema=https://raw.githubusercontent.com/xflash96/systemd-compose/main/config-schema.json
#
# A web app with a worker and a database. migrate creates the SQLite
# database, the api serves it, and the worker processes what the api
# queues. README.md says what to try.
name: webapp

# The whole project shares this cap.
resources:
  memory: 512M

services:
  # Runs to the end before the api starts.
  migrate:
    command: [python3, app/migrate.py, data/books.db]
    oneshot: true

  api:
    command: [python3, app/api.py, data/books.db]
    environment:
      PORT: "${API_PORT:-8080}"
    restart: on-failure
    depends_on:
      migrate: {condition: service_completed_successfully}
    # up waits until the api answers, and so does the worker.
    healthcheck:
      test: [python3, app/check.py, "http://127.0.0.1:${API_PORT:-8080}/health"]
      start_interval: 1s
      start_period: 30s

  worker:
    command: [python3, app/worker.py, data/books.db]
    restart: always
    depends_on:
      api: {condition: service_healthy}
