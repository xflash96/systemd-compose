# The logic lives in ci/; this file picks the runners, calls it, and publishes.
name: ci

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: groff, for the man page's lint and help's renderer test
        run: command -v groff || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends groff-base; }
      - run: ci/unit

  live:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04] # systemd 249 and 255
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: a user manager for the runner's user, through lingering (the tests wait for it)
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >>"$GITHUB_ENV"
      - run: go test -tags e2e -count=1 -v -timeout 30m ./e2e/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, live]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads the tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: the tag's section of CHANGELOG.md, as the release notes
        env:
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          awk -v tag="## $GITHUB_REF_NAME" '$0 == tag {f = 1; next} f && /^## / {exit} f' CHANGELOG.md >"$NOTES"
          grep -q '[^[:space:]]' "$NOTES" || { echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
